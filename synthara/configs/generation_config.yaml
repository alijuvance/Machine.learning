# Generation Configuration - Synthara
# Default parameters for synthetic data generation models

models:
  ctgan:
    epochs: 500
    batch_size: 500
    generator_dim: [256, 256]
    discriminator_dim: [256, 256]
    generator_lr: 0.0002
    discriminator_lr: 0.0002
    verbose: true
    enforce_rounding: true

  gaussian_copula:
    enforce_min_max_values: true
    default_distribution: "beta"

  tvae:
    epochs: 500
    batch_size: 500
    compress_dims: [128, 128]
    decompress_dims: [128, 128]
    l2scale: 0.00001
    verbose: true

# Default generation parameters
generation:
  default_model: "ctgan"
  default_num_rows: 10000
  random_seed: 42
  preserve_fraud_ratio: true
  fraud_ratio_override: null  # Set to a float (e.g., 0.01) to override

# African-specific constraints
constraints:
  mobile_money:
    min_transaction_amount: 10
    max_transaction_amount: 5000000
    valid_transaction_types:
      - "CASH_IN"
      - "CASH_OUT"
      - "PAYMENT"
      - "TRANSFER"
      - "DEBIT"
    balance_consistency: true  # newbalance = oldbalance +/- amount

  seasonality:
    enabled: true
    harvest_months: [3, 4, 9, 10]       # Peak months (March-April, Sept-Oct)
    lean_months: [6, 7, 8]               # Low activity months
    peak_multiplier: 1.4
    lean_multiplier: 0.7
